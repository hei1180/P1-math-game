<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Math Market Mini-Boss</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { touch-action: manipulation; } 
        body { 
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
            background-color: #fef08a; 
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            overflow: hidden; user-select: none; -webkit-user-select: none;
        }

        .bubbly-btn { transition: transform 0.1s; box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
        .bubbly-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,0.2); }
        
        .ten-frame { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; background: white; padding: 4px; border-radius: 8px; border: 3px solid #cbd5e1; margin: 0 auto; }
        .frame-cell { width: 32px; height: 32px; border: 2px dashed #94a3b8; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        @media (min-width: 768px) {
            .frame-cell { width: 45px; height: 45px; font-size: 28px; border-radius: 10px; }
            .ten-frame { gap: 6px; padding: 8px; border-radius: 16px; border-width: 5px; }
        }

        @keyframes pop { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.3s; }
        
        /* 🔥 EXTREME FEVER MODE 🔥 */
        @keyframes extremeFeverBg {
            0% { background-color: #ffe4e6; border-color: #fb7185; }
            33% { background-color: #fef9c3; border-color: #facc15; }
            66% { background-color: #d1fae5; border-color: #34d399; }
            100% { background-color: #e0e7ff; border-color: #818cf8; }
        }
        @keyframes feverShake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(3px, 3px) rotate(1.5deg); }
            50% { transform: translate(-3px, -3px) rotate(-1.5deg); }
            75% { transform: translate(-3px, 3px) rotate(0deg); }
        }
        @keyframes textPulse {
            0% { transform: translateY(-50%) scale(1); opacity: 0.2; }
            50% { transform: translateY(-50%) scale(1.1); opacity: 0.5; text-shadow: 0 0 20px #ef4444; }
            100% { transform: translateY(-50%) scale(1); opacity: 0.2; }
        }
        .fever-mode {
            animation: extremeFeverBg 0.4s infinite alternate !important;
            border: 8px solid #ef4444 !important;
            box-shadow: inset 0 0 50px rgba(255,0,0,0.5);
        }
        .fever-wiggle {
            animation: feverShake 0.15s ease-in-out;
        }
        
        /* Fever Text as a Background Watermark */
        #feverOverlayText {
            display: none; position: absolute; top: 50%; left: 0; right: 0;
            transform: translateY(-50%);
            text-align: center; font-size: clamp(3rem, 18vw, 8rem); font-weight: 900;
            color: rgba(255, 237, 74, 0.7); -webkit-text-stroke: 3px rgba(239, 68, 68, 0.6); 
            pointer-events: none; z-index: 1; /* Put it behind the game elements */
            animation: textPulse 0.6s infinite; letter-spacing: 2px;
        }

        #rankPopup { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; color: white; flex-direction: column; justify-content: center; align-items: center; }
        @keyframes slideUpFade { 0% { transform: translateY(50px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
        .rank-anim { font-size: clamp(3rem, 10vw, 6rem); font-weight: bold; color: #fbbf24; text-shadow: 0 6px 0 #b45309; animation: slideUpFade 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; text-align: center;}

        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-60px) scale(1.8); opacity: 0; } }
        .particle { position: fixed; pointer-events: none; font-weight: 900; font-size: 2.5rem; color: #f97316; -webkit-text-stroke: 1px white; text-shadow: 3px 3px 0 rgba(0,0,0,0.2); animation: floatUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; z-index: 100; }
        
        /* Ensure elements stay above the watermark */
        .game-layer { position: relative; z-index: 10; }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col relative">

    <div id="loginScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-blue-400 z-50 p-4">
        <h1 class="text-4xl md:text-6xl font-bold text-white mb-8 text-center drop-shadow-lg leading-tight">🍎 Math Market 🐻</h1>
        <button id="loginBtn" class="bubbly-btn bg-white text-blue-500 font-bold text-xl md:text-2xl py-4 px-6 md:px-8 rounded-full border-4 border-blue-200 flex items-center justify-center gap-3 w-[90%] max-w-sm">
            <svg class="w-8 h-8 flex-shrink-0" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            <span class="whitespace-nowrap">Login with Google</span>
        </button>
        <p class="text-white mt-4 font-bold">Welcome, Store Owner!</p>
    </div>

    <div id="menuScreen" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-green-400 z-40 p-4">
        <button id="adminBtn" class="absolute top-4 right-4 bg-gray-800 text-white p-2 md:p-3 rounded-lg bubbly-btn font-bold">⚙️ Teacher</button>
        <h1 class="text-3xl md:text-5xl font-bold text-white mb-2 drop-shadow-md text-center leading-tight">Select Difficulty</h1>
        <p id="playerNameDisplay" class="text-lg md:text-xl text-green-100 mb-6 md:mb-8 font-bold text-center w-full px-4 truncate"></p>
        
        <div class="flex flex-col gap-4 w-[90%] max-w-sm">
            <button onclick="startGame('easy')" class="bubbly-btn bg-green-100 text-green-700 font-bold text-xl md:text-2xl py-3 md:py-4 rounded-2xl border-4 border-green-300 w-full">Easy (1-10)</button>
            <button id="medBtn" onclick="startGame('medium')" class="bubbly-btn bg-yellow-100 text-yellow-700 font-bold text-xl md:text-2xl py-3 md:py-4 rounded-2xl border-4 border-yellow-300 opacity-50 cursor-not-allowed w-full">Medium (11-20) 🔒</button>
            <button id="hardBtn" onclick="startGame('hard')" class="bubbly-btn bg-red-100 text-red-700 font-bold text-xl md:text-2xl py-3 md:py-4 rounded-2xl border-4 border-red-300 opacity-50 cursor-not-allowed w-full">Hard (Mix) 🔒</button>
        </div>
    </div>

    <div id="gameScreen" class="hidden h-full w-full flex flex-col bg-white overflow-hidden relative">
        <div id="feverOverlayText">🔥 FEVER x2! 🔥</div>
        
        <div class="flex-none flex justify-between items-center p-2 md:p-4 bg-gray-100 border-b-4 border-gray-200 game-layer">
            <div class="text-lg md:text-2xl font-bold text-gray-700">Time: <span id="timerDisplay" class="text-red-500">30</span>s</div>
            <div class="text-lg md:text-2xl font-bold text-gray-700">Score: <span id="scoreDisplay" class="text-yellow-500">0</span></div>
            <div class="text-sm md:text-xl font-bold text-purple-600 bg-purple-100 px-2 md:px-3 py-1 rounded-full">Combo: <span id="comboDisplay">0</span></div>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center bg-blue-50/80 relative p-2 game-layer">
            <div id="customerBubble" class="bg-white border-4 border-gray-800 px-4 py-3 md:p-6 rounded-3xl mb-2 md:mb-4 text-2xl md:text-4xl font-bold relative animate-pop text-center shadow-lg">
                I need <span id="targetAmount" class="text-red-500 text-3xl md:text-5xl">5</span> <span id="targetItem">🍎</span>!
                <div class="absolute -bottom-3 md:-bottom-4 left-1/2 transform -translate-x-1/2 w-4 h-4 bg-white border-b-4 border-r-4 border-gray-800 rotate-45"></div>
            </div>
            <div class="text-6xl md:text-8xl drop-shadow-md">🐻</div>
        </div>

        <div class="flex-none bg-orange-100 border-t-8 border-orange-300 p-2 md:p-4 flex flex-col items-center justify-center gap-2 min-h-[80px] game-layer">
            <div id="tenFrameContainer" class="flex flex-wrap justify-center gap-2 md:gap-4 w-full"></div>
        </div>

        <div class="flex-none p-3 md:p-4 bg-orange-200 flex justify-center gap-2 md:gap-6 items-center game-layer">
            <button id="undoBtn" class="bubbly-btn bg-gray-300 text-gray-700 font-bold text-sm md:text-xl py-2 md:py-3 px-3 md:px-6 rounded-xl md:rounded-2xl border-4 border-gray-400 hidden">↩️<br>Undo</button>
            
            <div class="flex flex-col items-center gap-1 md:gap-2">
                <button id="itemBtn" class="bubbly-btn bg-white text-5xl md:text-6xl w-20 h-20 md:w-24 md:h-24 rounded-2xl md:rounded-3xl border-4 border-gray-300 flex items-center justify-center leading-none">🍎</button>
                <div id="helperBtns" class="hidden flex gap-1 md:gap-2">
                    <button class="bg-green-300 text-green-900 font-bold px-3 py-1 rounded-lg text-sm md:text-base bubbly-btn" onclick="addMultiple(5, event)">+5</button>
                    <button class="bg-blue-300 text-blue-900 font-bold px-3 py-1 rounded-lg text-sm md:text-base bubbly-btn" onclick="addMultiple(10, event)">+10</button>
                </div>
            </div>
            
            <button id="giveBtn" class="bubbly-btn bg-green-400 text-white font-black text-2xl md:text-4xl py-4 md:py-5 px-6 md:px-10 rounded-2xl md:rounded-3xl border-[5px] border-green-600 shadow-lg">GIVE!</button>
        </div>
    </div>

    <div id="rankPopup">
        <h2 class="text-3xl md:text-5xl mb-4 text-center font-bold px-4">You finished the game!</h2>
        <div id="rankText" class="rank-anim px-4">Top 10!</div>
    </div>

    <div id="leaderboardScreen" class="hidden absolute inset-0 flex flex-col items-center bg-purple-500 z-40 p-4 md:p-8 overflow-y-auto">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-4 md:mb-6 drop-shadow-md mt-4 text-center">🏆 Leaderboard</h1>
        <div class="bg-white rounded-3xl w-full max-w-md p-4 md:p-6 shadow-xl border-4 border-purple-300 mb-6">
            <table class="w-full text-left text-sm md:text-base" id="leaderboardTable">
                <thead><tr class="text-gray-400 border-b-2"><th>Rank</th><th>Name</th><th>Score</th></tr></thead>
                <tbody id="leaderboardBody"></tbody>
            </table>
        </div>
        <button onclick="showMenu()" class="bubbly-btn bg-yellow-400 text-yellow-900 font-bold text-xl md:text-2xl py-3 px-8 rounded-full border-4 border-yellow-500 mb-8">Back to Menu</button>
    </div>

    <div id="adminModal" class="hidden absolute inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 md:p-8 rounded-3xl w-full max-w-sm shadow-2xl">
            <div id="pinView">
                <h2 class="text-2xl font-bold mb-4 text-center">Teacher Access</h2>
                <input type="password" id="pinInput" placeholder="Enter PIN" class="border-4 border-gray-300 p-2 rounded-xl w-full mb-4 text-center text-xl focus:border-blue-500 outline-none">
                <div class="flex gap-2">
                    <button onclick="closeAdminModal()" class="bubbly-btn bg-gray-300 text-gray-700 p-3 rounded-xl flex-1 font-bold">Cancel</button>
                    <button onclick="checkPin()" class="bubbly-btn bg-blue-500 text-white p-3 rounded-xl flex-1 font-bold">Unlock</button>
                </div>
            </div>
            
            <div id="settingsView" class="hidden">
                <h2 class="text-2xl font-bold mb-4 text-center text-purple-600">Classroom Settings</h2>
                <div class="bg-gray-100 p-4 rounded-xl mb-4 border-2 border-gray-200">
                    <label class="flex items-center gap-3 text-lg font-bold text-gray-700 mb-2 cursor-pointer"><input type="checkbox" id="settingMed" class="w-6 h-6 accent-yellow-500 rounded"> Unlock Medium</label>
                    <label class="flex items-center gap-3 text-lg font-bold text-gray-700 cursor-pointer"><input type="checkbox" id="settingHard" class="w-6 h-6 accent-red-500 rounded"> Unlock Hard</label>
                </div>
                <div class="mb-6">
                    <label class="block text-lg font-bold mb-2 text-gray-700 text-center">Game Time (Seconds)</label>
                    <input type="number" id="settingTime" class="border-4 border-gray-300 p-2 rounded-xl w-full text-center text-2xl font-bold focus:border-purple-500 outline-none" min="10" max="120">
                </div>
                <button onclick="saveAdminSettings()" class="bubbly-btn bg-green-500 text-white py-3 px-4 rounded-xl w-full font-bold text-xl">Save Global Settings</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
        import { getFirestore, collection, doc, getDoc, setDoc, getDocs, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAdCj3BAfeU737QdpBQMPkfp1wWrNcBWc0",
            authDomain: "p1-maths.firebaseapp.com",
            projectId: "p1-maths",
            storageBucket: "p1-maths.firebasestorage.app",
            messagingSenderId: "593709237589",
            appId: "1:593709237589:web:d71dd6020234b554865bdc",
            measurementId: "G-ZWXELF5EK5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let playerInfo = { name: "Guest", uid: null, localHighScore: 0 };
        // Added maxCombo, totalAttempts, and correctAttempts tracking
        let gameState = { mode: 'easy', score: 0, combo: 0, maxCombo: 0, totalAttempts: 0, correctAttempts: 0, timeLeft: 30, timerId: null, isFever: false, feverTimeout: null, currentAmount: 0, currentItem: '🍎', targetAmount: 0, clickHistory: [] };
        let teacherSettings = { timeLimit: 30, unlockMedium: false, unlockHard: false };

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode); gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            
            if (type === 'click') {
                const baseFreq = 400 + (gameState.combo * 40); 
                osc.type = 'sine'; osc.frequency.setValueAtTime(baseFreq, now); osc.frequency.exponentialRampToValueAtTime(baseFreq + 200, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'success') {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(554, now + 0.1); osc.frequency.setValueAtTime(659, now + 0.2);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.4);
                osc.start(now); osc.stop(now + 0.4);
            } else if (type === 'error') {
                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        }

        function spawnParticle(x, y, amount) {
            const el = document.createElement('div');
            el.className = 'particle'; el.innerText = `+${amount}`;
            el.style.left = `${x - 20}px`; el.style.top = `${y - 20}px`;
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }
        
        function triggerWiggle() {
            if (!gameState.isFever) return;
            const screen = document.getElementById('gameScreen');
            screen.classList.remove('fever-wiggle');
            void screen.offsetWidth; // Trigger reflow
            screen.classList.add('fever-wiggle');
        }

        function endFever() {
            clearTimeout(gameState.feverTimeout);
            gameState.isFever = false;
            gameState.combo = 0;
            document.getElementById('gameScreen').classList.remove('fever-mode', 'fever-wiggle');
            document.getElementById('feverOverlayText').style.display = 'none';
            updateUI();
        }

        document.getElementById('loginBtn').addEventListener('click', () => {
            initAudio(); 
            signInWithPopup(auth, provider).catch(error => { console.error(error); alert("Login failed. Check console."); });
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                playerInfo.name = user.displayName || user.email.split('@')[0];
                playerInfo.uid = user.uid;
                loadGlobalSettings();
                document.getElementById('playerNameDisplay').innerText = `Welcome, ${playerInfo.name}!`;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('menuScreen').classList.remove('hidden');
                updateMenuLocks();
            }
        });

        function updateMenuLocks() {
            const mBtn = document.getElementById('medBtn');
            const hBtn = document.getElementById('hardBtn');
            if (playerInfo.localHighScore >= 150 && teacherSettings.unlockMedium) { mBtn.classList.remove('opacity-50', 'cursor-not-allowed'); mBtn.innerText = "Medium (11-20)"; } 
            else { mBtn.classList.add('opacity-50', 'cursor-not-allowed'); mBtn.innerText = "Medium (11-20) 🔒"; }
            if (playerInfo.localHighScore >= 250 && teacherSettings.unlockHard) { hBtn.classList.remove('opacity-50', 'cursor-not-allowed'); hBtn.innerText = "Hard (Mix)"; } 
            else { hBtn.classList.add('opacity-50', 'cursor-not-allowed'); hBtn.innerText = "Hard (Mix) 🔒"; }
        }

        window.startGame = function(mode) {
            if (mode === 'medium' && (playerInfo.localHighScore < 150 || !teacherSettings.unlockMedium)) return;
            if (mode === 'hard' && (playerInfo.localHighScore < 250 || !teacherSettings.unlockHard)) return;

            initAudio();
            // Reset all counters when game starts
            gameState.mode = mode; gameState.score = 0; gameState.combo = 0; gameState.maxCombo = 0; gameState.totalAttempts = 0; gameState.correctAttempts = 0; gameState.timeLeft = teacherSettings.timeLimit;
            
            endFever(); // Reset fever states securely
            
            document.getElementById('menuScreen').classList.add('hidden');
            document.getElementById('leaderboardScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            
            document.getElementById('helperBtns').classList.toggle('hidden', mode === 'easy');
            document.getElementById('undoBtn').classList.remove('hidden');

            updateUI();
            nextCustomer();
            
            clearInterval(gameState.timerId);
            gameState.timerId = setInterval(() => {
                gameState.timeLeft--; document.getElementById('timerDisplay').innerText = gameState.timeLeft;
                if (gameState.timeLeft <= 0) endGame();
            }, 1000);
        };

        const items = ['🍎', '🍭', '🧸', '🖍️', '🍪'];

        function nextCustomer() {
            gameState.currentAmount = 0; gameState.clickHistory = [];
            gameState.currentItem = items[Math.floor(Math.random() * items.length)];
            
            if (gameState.mode === 'easy') gameState.targetAmount = Math.floor(Math.random() * 10) + 1;
            else if (gameState.mode === 'medium') gameState.targetAmount = Math.floor(Math.random() * 10) + 11;
            else gameState.targetAmount = Math.floor(Math.random() * 20) + 10; 

            document.getElementById('targetAmount').innerText = gameState.targetAmount;
            document.getElementById('targetItem').innerText = gameState.currentItem;
            document.getElementById('itemBtn').innerText = gameState.currentItem;
            
            document.getElementById('customerBubble').classList.remove('animate-pop');
            void document.getElementById('customerBubble').offsetWidth; 
            document.getElementById('customerBubble').classList.add('animate-pop');
            renderTenFrames();
        }

        window.addMultiple = function(amount, e) { addItem(amount, e); }
        document.getElementById('itemBtn').addEventListener('pointerdown', (e) => addItem(1, e));

        window.addItem = function(amount, e) {
            if (gameState.currentAmount + amount <= 40) { 
                gameState.currentAmount += amount; gameState.clickHistory.push(amount); renderTenFrames(); playSound('click');
                if (e && e.clientX) spawnParticle(e.clientX, e.clientY, amount);
                triggerWiggle();
            }
        }

        document.getElementById('undoBtn').addEventListener('click', () => {
            if (gameState.clickHistory.length > 0) { 
                gameState.currentAmount -= gameState.clickHistory.pop(); renderTenFrames(); 
                triggerWiggle();
            }
        });

        function renderTenFrames() {
            const container = document.getElementById('tenFrameContainer');
            container.innerHTML = '';
            const numFrames = Math.max(1, Math.ceil(gameState.targetAmount / 10), Math.ceil(gameState.currentAmount / 10));
            
            let html = '';
            for (let f = 0; f < numFrames; f++) {
                html += `<div class="ten-frame">`;
                for (let i = 0; i < 10; i++) {
                    const itemIndex = (f * 10) + i;
                    const content = itemIndex < gameState.currentAmount ? gameState.currentItem : '';
                    html += `<div class="frame-cell">${content}</div>`;
                }
                html += `</div>`;
            }
            container.innerHTML = html;
        }

        document.getElementById('giveBtn').addEventListener('pointerdown', () => {
            triggerWiggle();
            gameState.totalAttempts++; // Track submission attempt
            
            if (gameState.currentAmount === gameState.targetAmount) {
                gameState.correctAttempts++; // Track correct answers
                playSound('success'); 
                gameState.combo++;
                
                // Track highest combo
                if (gameState.combo > gameState.maxCombo) {
                    gameState.maxCombo = gameState.combo;
                }
                
                let points = gameState.mode === 'hard' ? 30 : (gameState.mode === 'medium' ? 20 : 10);
                
                if (gameState.combo >= 5) {
                    if (!gameState.isFever) {
                        gameState.isFever = true;
                        document.getElementById('gameScreen').classList.add('fever-mode');
                        document.getElementById('feverOverlayText').style.display = 'block';
                    }
                    points *= 2; 
                    
                    // Start/Reset the 10-second Fever Timer
                    clearTimeout(gameState.feverTimeout);
                    gameState.feverTimeout = setTimeout(() => {
                        endFever();
                    }, 10000);
                }

                gameState.score += points; updateUI(); nextCustomer();
            } else {
                playSound('error'); 
                endFever(); // Break fever on a wrong answer
                
                document.getElementById('customerBubble').classList.remove('animate-shake');
                void document.getElementById('customerBubble').offsetWidth;
                document.getElementById('customerBubble').classList.add('animate-shake');
                updateUI();
            }
        });

        function updateUI() {
            document.getElementById('scoreDisplay').innerText = gameState.score;
            document.getElementById('comboDisplay').innerText = gameState.combo;
            document.getElementById('timerDisplay').innerText = gameState.timeLeft;
        }

        async function endGame() {
            clearInterval(gameState.timerId);
            endFever(); // Clear all fever effects
            
            if (gameState.score > playerInfo.localHighScore) playerInfo.localHighScore = gameState.score;

            // Calculate Accuracy %
            let accuracyPercent = 0;
            if (gameState.totalAttempts > 0) {
                accuracyPercent = Math.round((gameState.correctAttempts / gameState.totalAttempts) * 100);
            }

            try {
                const playerRef = doc(db, "scores", playerInfo.uid); 
                const playerSnap = await getDoc(playerRef);
                let shouldSave = true;
                
                if (playerSnap.exists()) {
                    if (gameState.score <= playerSnap.data().score) shouldSave = false; 
                }
                
                if (shouldSave) {
                    await setDoc(playerRef, {
                        playerName: playerInfo.name, 
                        uid: playerInfo.uid, 
                        score: gameState.score,
                        maxCombo: gameState.maxCombo,    // Saves the highest combo achieved
                        accuracy: accuracyPercent,       // Saves accuracy
                        mode: gameState.mode, 
                        timestamp: serverTimestamp()
                    });
                }
            } catch (e) { console.warn("Offline mode save fall-back"); }
            showRankPopup();
        }

        async function showRankPopup() {
            const popup = document.getElementById('rankPopup');
            const rankText = document.getElementById('rankText');
            popup.style.display = 'flex'; rankText.innerText = "Saving Score...";
            
            setTimeout(() => {
                rankText.innerText = gameState.score > 100 ? "Top 10! 🏆" : "Great Job! ⭐";
                setTimeout(() => { popup.style.display = 'none'; showLeaderboard(); }, 3000);
            }, 1000);
        }

        async function showLeaderboard() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('leaderboardScreen').classList.remove('hidden');
            const tbody = document.getElementById('leaderboardBody');
            tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4">Loading...</td></tr>';

            try {
                const q = query(collection(db, "scores"), orderBy("score", "desc"), limit(10));
                const querySnapshot = await getDocs(q); tbody.innerHTML = '';
                
                let rank = 1;
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    let rowClass = data.uid === playerInfo.uid ? 'bg-yellow-100 font-bold text-gray-900' : 'text-gray-700';
                    tbody.innerHTML += `<tr class="${rowClass} border-b border-purple-200"><td class="py-3 px-2">${rank}</td><td class="px-2">${data.playerName}</td><td class="px-2">${data.score}</td></tr>`;
                    rank++;
                });
                if(querySnapshot.empty) tbody.innerHTML = '<tr><td colspan="3" class="text-center py-4 text-white">You are first!</td></tr>';
            } catch (e) { tbody.innerHTML = `<tr><td colspan="3" class="text-center py-4 text-red-200">Offline Score: ${gameState.score}</td></tr>`; }
        }

        window.showMenu = function() { updateMenuLocks(); document.getElementById('leaderboardScreen').classList.add('hidden'); document.getElementById('menuScreen').classList.remove('hidden'); }

        async function loadGlobalSettings() {
            try {
                const settingsSnap = await getDoc(doc(db, "settings", "global"));
                if (settingsSnap.exists()) { teacherSettings = settingsSnap.data(); updateMenuLocks(); }
            } catch(e) {}
        }

        window.closeAdminModal = function() { document.getElementById('adminModal').classList.add('hidden'); document.getElementById('pinView').classList.remove('hidden'); document.getElementById('settingsView').classList.add('hidden'); document.getElementById('pinInput').value = ''; }
        document.getElementById('adminBtn').addEventListener('click', () => { document.getElementById('adminModal').classList.remove('hidden'); document.getElementById('pinView').classList.remove('hidden'); document.getElementById('settingsView').classList.add('hidden'); document.getElementById('pinInput').value = ''; });

        window.checkPin = function() {
            if (document.getElementById('pinInput').value === '1128') {
                document.getElementById('pinView').classList.add('hidden'); document.getElementById('settingsView').classList.remove('hidden');
                document.getElementById('settingMed').checked = teacherSettings.unlockMedium; document.getElementById('settingHard').checked = teacherSettings.unlockHard; document.getElementById('settingTime').value = teacherSettings.timeLimit;
            } else alert("Incorrect PIN");
        }

        window.saveAdminSettings = async function() {
            teacherSettings.unlockMedium = document.getElementById('settingMed').checked; teacherSettings.unlockHard = document.getElementById('settingHard').checked; teacherSettings.timeLimit = parseInt(document.getElementById('settingTime').value) || 30;
            try { await setDoc(doc(db, "settings", "global"), teacherSettings); alert("Settings saved globally."); } catch(e) { alert("Saved locally."); }
            updateMenuLocks(); closeAdminModal();
        }
    </script>
</body>
</html>
