<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Robot Workshop 形狀機械人工場</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">{ "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.min.js",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js" } }</script>
    <link rel="stylesheet" href="shared.css?v=0">
    <style>
        #stage canvas { display: block; touch-action: none; }
        #stage { touch-action: none; }
        #gameScreen.fever-mode { border-width: 6px !important; }
        #leaderboardScreen:not(.hidden) .lb-pop { animation: lbPop .28s cubic-bezier(.34,1.56,.64,1); }
        @keyframes lbPop { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes uiPop { from { transform: scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
        @keyframes uiPulse { from { transform: scale(1); } to { transform: scale(1.35); } }
        .ui-pop { animation: uiPop .3s cubic-bezier(.34,1.56,.64,1) both; }
        .ui-pulse { animation: uiPulse .5s ease-in-out infinite alternate; }
        @media (prefers-reduced-motion: reduce) {
            #leaderboardScreen .lb-pop, .ui-pop, .ui-pulse { animation: none !important; }
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col relative">
    <div id="loginScreen" class="absolute inset-0 flex flex-col items-center justify-center bg-emerald-500 z-50 p-4">
        <h1 class="text-4xl md:text-6xl font-bold text-white mb-8 text-center drop-shadow-lg leading-tight">🤖 Robot Workshop 形狀機械人工場</h1>
        <div id="loginSpinner" class="spinner"></div>
        <button id="loginBtn" class="hidden bubbly-btn bg-white text-emerald-600 font-bold text-xl md:text-2xl py-4 px-8 rounded-full border-4 border-emerald-200 w-[90%] max-w-sm">Login with Google</button>
        <a href="index.html" class="text-white mt-6 underline font-bold">⬅ Back to games</a>
    </div>

    <div id="gameScreen" class="hidden absolute inset-0 flex flex-col bg-sky-100 overflow-hidden">
        <div id="feverOverlayText">🔥 FEVER x2! 🔥</div>
        <div id="hud" class="hidden flex-none flex justify-between items-center px-3 py-1 bg-white/90 border-b-4 border-emerald-200 game-layer">
            <div class="text-lg md:text-2xl font-bold text-gray-700">Time: <span id="timerDisplay" class="text-red-500">60</span>s</div>
            <div class="text-lg md:text-2xl font-bold text-gray-700">Score: <span id="scoreDisplay" class="text-yellow-500">0</span></div>
            <div class="text-sm md:text-xl font-bold text-purple-600 bg-purple-100 px-2 py-1 rounded-full">Combo: <span id="comboDisplay">0</span></div>
        </div>
        <div id="stageWrap" class="flex-1 relative min-h-0">
            <div id="stage" class="absolute inset-0"></div>
            <div id="ui" class="absolute inset-0 overflow-hidden" style="pointer-events:none"></div>
        </div>
        <div id="cornerBtns" class="absolute top-2 right-2 flex gap-2 z-20">
            <div class="test-badge hidden bg-purple-600 text-white font-bold px-2 py-1 rounded-full text-sm self-center">🧪 Test</div>
            <button id="muteBtn" aria-label="Sound 聲音" class="bg-white/80 rounded-lg px-2 py-1 text-xl bubbly-btn min-w-[48px] min-h-[40px]">🔊</button>
            <button id="adminBtn" aria-label="Teacher 老師" class="bg-gray-800 text-white rounded-lg px-2 py-1 font-bold bubbly-btn min-w-[48px] min-h-[40px]">⚙️</button>
        </div>
    </div>

    <div id="noWebgl" class="hidden absolute inset-0 z-50 flex flex-col items-center justify-center bg-emerald-500 p-6 text-center text-white">
        <div class="text-6xl mb-4">🤖</div>
        <h1 class="text-3xl md:text-5xl font-bold mb-2">這部機未能顯示立體圖形</h1>
        <p class="text-xl md:text-2xl mb-8">This device can't show 3-D shapes.</p>
        <a href="index.html" class="bubbly-btn bg-white text-emerald-600 font-bold text-xl py-3 px-8 rounded-full border-4 border-emerald-200">⬅ 返回 Back to games</a>
    </div>

    <div id="rankPopup">
        <h2 class="text-3xl md:text-5xl mb-4 text-center font-bold px-4">完成！Finished!</h2>
        <div id="rankScore" class="text-4xl md:text-6xl font-bold mb-4"></div>
        <div id="rankTrophy" class="rank-anim px-4"></div>
    </div>

    <div id="leaderboardScreen" class="hidden fixed inset-0 z-40 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-md">
        <div id="lbCard" class="lb-pop relative w-full max-w-md max-h-[92dvh] flex flex-col bg-white rounded-3xl shadow-2xl border-4 border-purple-300 overflow-hidden">
            <button id="lbClose" aria-label="Close 關閉" class="bubbly-btn absolute top-2 right-2 w-12 h-12 rounded-full bg-white/90 text-purple-700 font-bold text-xl shadow z-10">✕</button>
            <h1 class="flex-none bg-purple-500 text-white text-2xl md:text-4xl font-bold text-center py-4 px-14 whitespace-nowrap drop-shadow-md">🏆 Robot Rush</h1>
            <div class="flex flex-none text-sm md:text-base">
                <button id="tab-shapes3d" class="flex-1 py-3 font-bold bg-white text-purple-600" data-lb="shapes3d">立體 3-D</button>
                <button id="tab-shapes2d" class="flex-1 py-3 font-bold bg-purple-300 text-purple-700" data-lb="shapes2d">平面 2-D</button>
            </div>
            <div class="flex-1 min-h-0 overflow-y-auto p-4 md:p-5">
                <table class="w-full text-left text-sm md:text-base"><thead><tr class="text-gray-400 border-b-2"><th>Rank</th><th>Name</th><th>Score</th></tr></thead><tbody id="leaderboardBody"></tbody></table>
            </div>
            <div class="flex-none flex justify-center p-3 border-t-2 border-purple-100">
                <button id="lbBack" class="bubbly-btn bg-yellow-400 text-yellow-900 font-bold text-xl py-2 px-8 rounded-full border-4 border-yellow-500 min-h-[48px]">返回工場 Back to workshop</button>
            </div>
        </div>
    </div>

    <script type="module" src="shapes/main.js?v=0"></script>
</body>
</html>
